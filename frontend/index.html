<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare - Student Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎓 CampusCare</h1>
        <p>Student Support & Assistance Platform</p>
    </header>

    <main>
        <section class="card">
            <h2>Submit a Support Request</h2>
            <p>Tell us what you need help with.</p>

            <form id="ticketForm">

                <input
                    type="text"
                    id="student_name"
                    placeholder="Your name"
                    required
                >

                <input
                    type="email"
                    id="student_email"
                    placeholder="Your university email"
                    required
                >

                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Academic">Academic</option>
                    <option value="IT Support">IT Support</option>
                    <option value="Finance">Finance</option>
                    <option value="Student Affairs">Student Affairs</option>
                    <option value="Other">Other</option>
                </select>

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Describe your issue..."
                    required
                ></textarea>

                <button type="submit">Submit Request</button>

            </form>

            <div id="message"></div>
        </section>

        <section class="card">
            <h2>Support Requests</h2>
            <button id="loadTickets">View My Requests</button>

            <div id="tickets"></div>
        </section>
    </main>

    <footer>
        <p>CampusCare © 2026 | Student Support Platform</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
